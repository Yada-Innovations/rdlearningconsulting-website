# Netlify configuration for RD Learning & Consulting

[build]
  publish = "."

# Clean URLs — Netlify serves /about/ from about/index.html automatically
# The settings below handle additional edge cases

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/our-services"
  to = "/services/"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
  force = true

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
